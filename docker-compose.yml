# Infrastructure only by default:      docker compose up -d
# Infrastructure + the 3 services:     docker compose --profile apps up --build
name: order-inventory-payment-saga

# Settings shared by the three application services (only started with --profile apps).
x-service-defaults: &service-defaults
  profiles: ["apps"]
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  #   - localhost:9092 -> for services running on your machine (IDE, mvn spring-boot:run)
  #   - kafka:19092    -> for services running inside this compose network
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  order-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: order-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USER: saga
      DB_PASSWORD: saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  inventory-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: inventory-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USER: saga
      DB_PASSWORD: saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  payment-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: saga
      DB_PASSWORD: saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

volumes:
  pgdata:
